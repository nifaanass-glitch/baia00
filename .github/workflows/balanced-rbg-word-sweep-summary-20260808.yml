name: Summarize balanced RBG word-family sweep 20260808

on:
  workflow_run:
    workflows: ['Balanced RBG word-family sweep 20260808']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  summarize:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: /tmp/rbg-word-artifacts
          pattern: rbg-word-*
          merge-multiple: false
      - name: Aggregate terminal results
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p results/balanced-rbg-word-sweep-20260808
          python - <<'PY'
          import glob,json,os,pathlib
          records=[]
          for path in sorted(glob.glob('/tmp/rbg-word-artifacts/**/result.json',recursive=True)):
              try:
                  rec=json.load(open(path)); rec['_artifact_path']=path; records.append(rec)
              except Exception as e:
                  records.append({'_artifact_path':path,'parse_error':repr(e)})
          out={
              'source_run_id':os.environ['SOURCE_RUN_ID'],
              'source_head_sha':os.environ['SOURCE_HEAD_SHA'],
              'records':records,
              'terminal_hits':[{'label':r.get('label'),'marked_dual':c} for r in records for c in r.get('terminal_hits',[])],
          }
          out['summary']={
              'records':len(records),
              'completed_without_fatal_error':sum('fatal_error' not in r for r in records),
              'terminal_hits':len(out['terminal_hits']),
          }
          json.dump(out,open('results/balanced-rbg-word-sweep-20260808/summary.json','w'),indent=2,sort_keys=True)
          print(json.dumps(out['summary'],sort_keys=True))
          PY
      - name: Commit summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/balanced-rbg-word-sweep-20260808
          git commit -m 'Store balanced RBG word-family sweep summary 20260808' || exit 0
          git push
