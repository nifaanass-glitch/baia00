name: K15 blue-green Lee concordance audit
on:
  push:
    paths:
      - '.github/workflows/k15-bg-khoca.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir 'py==1.11.0' 'khoca==1.5'
      - id: compute
        continue-on-error: true
        run: |
          cat > /tmp/compute.py <<'PY'
          import json,time,sys,platform
          from khoca import InteractiveCalculator
          BG_PD=[(28,24,29,23),(24,6,25,5),(25,10,26,11),(9,26,10,27),(6,28,7,27),(16,29,17,30),(30,13,31,14),(31,3,18,2),(1,19,2,18),(14,19,15,20),(20,15,21,16),(21,9,22,8),(7,23,8,22),(11,4,12,5),(12,0,13,17),(3,0,4,1)]
          tests={'two_component_unlink':'braidaA','positive_hopf':'braidaa','negative_hopf':'braidAA','K15_BG':BG_PD}
          out={'python':sys.version,'platform':platform.platform(),'PD':BG_PD,'calculations':{}}
          for field,calc in {'Q':InteractiveCalculator(1,(0,-1),0),'F3':InteractiveCalculator(3,(0,-1),0)}.items():
              out['calculations'][field]={}
              for name,knot in tests.items():
                  st=time.time()
                  try:
                      result,messages=calc(knot,print_messages=True,progress=True)
                      active=[]
                      for t,q,torsion,coef in result[1]:
                          c=int(coef)
                          if c:active.extend([int(q)]*abs(c))
                      active.sort()
                      rec={'elapsed':time.time()-st,'active_unreduced_q':active,'result':result,'messages':messages}
                  except BaseException as exc:
                      rec={'elapsed':time.time()-st,'error_type':type(exc).__name__,'error':repr(exc)}
                  out['calculations'][field][name]=rec
                  print('LEE',field,name,json.dumps({k:v for k,v in rec.items() if k not in ['messages','result']},sort_keys=True),flush=True)
                  with open('k15-bg-khoca.json','w') as f:json.dump(out,f,indent=2,sort_keys=True)
          out['comparison']={field:{name:out['calculations'][field][name].get('active_unreduced_q') for name in tests} for field in out['calculations']}
          with open('k15-bg-khoca.json','w') as f:json.dump(out,f,indent=2,sort_keys=True)
          print('FINAL',json.dumps(out['comparison'],sort_keys=True),flush=True)
          PY
          python /tmp/compute.py 2>&1 | tee k15-bg-khoca.log
      - if: always()
        env:
          OUTCOME: ${{ steps.compute.outcome }}
        run: |
          mkdir -p results/k15-bg-khoca
          cp k15-bg-khoca.* results/k15-bg-khoca/ 2>/dev/null || true
          printf '%s\n' "$OUTCOME" > results/k15-bg-khoca/outcome.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/k15-bg-khoca
          if ! git diff --cached --quiet; then git commit -m 'Store K15 blue-green Lee audit'; git push; fi
