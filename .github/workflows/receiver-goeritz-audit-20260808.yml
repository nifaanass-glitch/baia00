name: Receiver pure-Python Goeritz audit 20260808

on:
  push:
    paths:
      - '.github/workflows/receiver-goeritz-audit-20260808.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goeritz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir 'snappy==3.3.2' 'sympy==1.14.0' 'networkx==3.5' 'numpy==2.3.2'
      - name: Exact Goeritz determinant and signature
        run: |
          rm -rf results/receiver-goeritz-20260808
          mkdir -p results/receiver-goeritz-20260808
          cat > /tmp/goeritz.py <<'PY'
          import json, time
          import numpy as np
          import networkx as nx
          import sympy as sp
          import snappy
          from spherogram import Link
          from spherogram.links.links import CrossingStrand

          def component_goeritz(L, vertices, all_edges):
              V=sorted(vertices); idx={v:i for i,v in enumerate(V)}; n=len(V)
              M=[[0]*n for _ in range(n)]; edges=[]
              for u,v,sgn,csign in all_edges:
                  if u in idx and v in idx:
                      i,j=idx[u],idx[v]; M[i][j]+=sgn; M[j][i]+=sgn; edges.append((sgn,csign))
              for i in range(n): M[i][i]=-sum(M[r][i] for r in range(n))
              red=sp.Matrix([row[1:] for row in M[1:]]) if n>1 else sp.zeros(0)
              det=abs(int(red.det(method='domain-ge'))) if red.rows else 1
              if red.rows:
                  vals=np.linalg.eigvalsh(np.array(red.tolist(),dtype=float)); tol=1e-7
                  inertia=(int((vals>tol).sum()),int((vals<-tol).sum()),int((abs(vals)<=tol).sum()))
                  sig=inertia[0]-inertia[1]
              else: inertia=(0,0,0); sig=0
              corr=sum(sgn for sgn,csign in edges if sgn==csign)
              return {'rank':red.rows,'determinant':det,'inertia':inertia,'matrix_signature':sig,'correction':corr,'knot_signature_new_convention':-(sig+corr)}

          data=json.load(open('research/receiver_candidates_20260808.json')); out={}
          for name,rec in data.items():
              t=time.time(); L=Link(rec['pd']); faces=L.faces(); face_of={corner:i for i,face in enumerate(faces) for corner in face}
              edges=[]; G=nx.MultiGraph(); G.add_nodes_from(range(len(faces)))
              for c in L.crossings:
                  u=face_of[CrossingStrand(c,0)]; v=face_of[CrossingStrand(c,2)]; edges.append((u,v,1,int(c.sign))); G.add_edge(u,v)
                  u=face_of[CrossingStrand(c,1)]; v=face_of[CrossingStrand(c,3)]; edges.append((u,v,-1,int(c.sign))); G.add_edge(u,v)
              comps=sorted(nx.connected_components(G),key=lambda s:(len(s),sorted(s)))
              recout={'crossings':len(L.crossings),'component_sizes':[len(c) for c in comps],'goeritz':[]}
              for comp in comps: recout['goeritz'].append(component_goeritz(L,comp,edges))
              recout['elapsed_seconds']=time.time()-t; out[name]=recout
              print(name,json.dumps(recout,sort_keys=True),flush=True)
          with open('results/receiver-goeritz-20260808/results.json','w') as f:json.dump(out,f,indent=2,sort_keys=True)
          PY
          python /tmp/goeritz.py 2>&1 | tee results/receiver-goeritz-20260808/run.log
      - name: Commit results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add results/receiver-goeritz-20260808
          git commit -m 'Store receiver Goeritz audit 20260808 rerun' || exit 0
          git push
