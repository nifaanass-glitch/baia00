name: Reassign trefoil receiver handle roles 20260809

on:
  push:
    paths:
      - '.github/workflows/reassign-trefoil-receiver-roles-20260809.yml'
      - 'research/reassign_trefoil_core_roles.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        infect_component: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir 'snappy==3.3.2' 'knot_floer_homology==1.2.2'
          python -m knot_floer_homology.test
      - name: Audit all role assignments
        env:
          INFECT_COMPONENT: ${{ matrix.infect_component }}
          OUTPUT_DIR: out/reassign-trefoil-ci${{ matrix.infect_component }}
          PYTHONHASHSEED: '2'
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p "$OUTPUT_DIR"
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 340m \
            python research/reassign_trefoil_core_roles.py \
            2>&1 | tee "$OUTPUT_DIR/run.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reassign-trefoil-ci${{ matrix.infect_component }}
          path: out/reassign-trefoil-ci${{ matrix.infect_component }}
          retention-days: 7

  summarize:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: reassign-trefoil-*
          path: /tmp/reassign-artifacts
      - name: Aggregate role reassignment results
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p results/reassign-trefoil-receiver-roles-20260809
          python - <<'PY'
          import glob,json,os
          records=[]
          for path in sorted(glob.glob('/tmp/reassign-artifacts/**/result.json',recursive=True)):
              try:
                  rec=json.load(open(path)); rec['_artifact_path']=path; records.append(rec)
              except Exception as exc:
                  records.append({'_artifact_path':path,'parse_error':repr(exc)})
          hits=[
              {'infected_original_component':r.get('infected_original_component'),**hit}
              for r in records for hit in r.get('terminal_hits',[])
          ]
          out={
              'source_run_id':os.environ['SOURCE_RUN_ID'],
              'source_head_sha':os.environ['SOURCE_HEAD_SHA'],
              'records':records,
              'terminal_hits':hits,
              'summary':{
                  'records':len(records),
                  'structurally_valid_roles':sum(
                      bool(role.get('receiver_structurally_valid'))
                      for r in records for role in r.get('roles',[])
                  ),
                  'terminal_hits':len(hits),
              },
          }
          json.dump(out,open('results/reassign-trefoil-receiver-roles-20260809/summary.json','w'),indent=2,sort_keys=True)
          print(json.dumps(out['summary'],sort_keys=True))
          if hits:
              print('TERMINAL_HITS',json.dumps(hits,sort_keys=True))
          PY
      - name: Commit role-reassignment summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add results/reassign-trefoil-receiver-roles-20260809
          git commit -m 'Store trefoil receiver role-reassignment summary 20260809' || exit 0
          git push
