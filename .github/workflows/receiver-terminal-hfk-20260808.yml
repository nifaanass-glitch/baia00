name: Receiver terminal HFK audit 20260808

on:
  push:
    paths:
      - '.github/workflows/receiver-terminal-hfk-20260808.yml'
      - 'research/receiver_candidates_20260808.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hfk:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        candidate:
          - valid_trefoil_seed1
          - valid_trefoil_seed12
          - original_receiver_alt_dual79
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned knot Floer calculator
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir 'knot_floer_homology==1.2.2'
          python -m knot_floer_homology.test
      - name: Compute Morse presentation and HFK
        env:
          CANDIDATE: ${{ matrix.candidate }}
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p results/receiver-terminal-hfk
          cat > /tmp/run_hfk.py <<'PY'
          import json, os, platform, sys, time, traceback
          import knot_floer_homology as hfk

          name=os.environ['CANDIDATE']
          data=json.load(open('research/receiver_candidates_20260808.json'))[name]
          pd=data['pd']
          out={
              'candidate':name,
              'input_crossings':len(pd),
              'python':sys.version,
              'platform':platform.platform(),
              'package_version':getattr(hfk,'__version__',None),
          }
          start=time.time()
          try:
              t=time.time(); morse=hfk.pd_to_morse(pd)
              out['morse']=morse; out['morse_seconds']=time.time()-t
              print('MORSE',json.dumps(morse,sort_keys=True),flush=True)
          except BaseException as exc:
              out['morse_error']={'type':type(exc).__name__,'repr':repr(exc),'traceback':traceback.format_exc()}
              print('MORSE_ERROR',repr(exc),flush=True)
          try:
              t=time.time(); ans=hfk.pd_to_hfk(pd,prime=2,complex=False)
              out['hfk']=ans; out['hfk_seconds']=time.time()-t
              summary={k:ans.get(k) for k in ['tau','nu','epsilon','seifert_genus','fibered','L_space_knot','total_rank','modulus']}
              out['summary']=summary
              out['terminal_nonslice']=bool(summary.get('tau') or summary.get('nu') or summary.get('epsilon'))
              print('HFK_SUMMARY',json.dumps(summary,sort_keys=True),flush=True)
          except BaseException as exc:
              out['hfk_error']={'type':type(exc).__name__,'repr':repr(exc),'traceback':traceback.format_exc()}
              print('HFK_ERROR',repr(exc),flush=True)
          out['elapsed_seconds']=time.time()-start
          path=f'results/receiver-terminal-hfk/{name}.json'
          with open(path,'w') as f: json.dump(out,f,indent=2,sort_keys=True)
          print('OUTPUT',path,flush=True)
          PY
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 340m python /tmp/run_hfk.py 2>&1 | tee "results/receiver-terminal-hfk/${CANDIDATE}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receiver-terminal-hfk-${{ matrix.candidate }}
          path: results/receiver-terminal-hfk/
          if-no-files-found: warn
          retention-days: 7
