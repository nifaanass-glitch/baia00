name: Winding-one balanced receiver redesign v2 20260808

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        companion: [unknot, T2_3, T2_5, T2_7, mirror_T2_3, mirror_T2_5, T3_4, trefoil_sum2]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir 'snappy==3.3.2' 'knot_floer_homology==1.2.2'
      - name: Run corrected proof-carrying winding-one screen
        env:
          COMPANION: ${{ matrix.companion }}
          OUTPUT_DIR: out/winding-one-v2-${{ matrix.companion }}
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p "$OUTPUT_DIR"
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 340m \
            python research/winding_one_receiver_sweep.py \
            2>&1 | tee "$OUTPUT_DIR/run.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winding-one-v2-${{ matrix.companion }}
          path: out/winding-one-v2-${{ matrix.companion }}
          retention-days: 7
