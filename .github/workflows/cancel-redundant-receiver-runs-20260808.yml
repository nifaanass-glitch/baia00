name: Cancel redundant receiver runs 20260808

on:
  push:
    paths:
      - '.github/workflows/cancel-redundant-receiver-runs-20260808.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only superseded duplicate runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          for run in \
            31254724689 31254724694 \
            31255405576 31255846797 31256072022 31256229933 \
            31255405563 31255846814 31256072019 31256229920 \
            31255405586 31255846794 31256072028 31256229961 \
            31255846798 31256072020 31256229904 \
            31256229919 \
            31255846805 31256072025 31256229974
          do
            echo "cancel $run"
            gh api --method POST "/repos/$REPO/actions/runs/$run/cancel" || true
          done
