name: Cork 2R small cocore Khoca audit 20260809

on:
  push:
    paths:
      - '.github/workflows/cork-2r-small-khoca-20260809.yml'
      - 'research/cork_2r_small_candidates_20260809.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rasmussen:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir 'py==1.11.0' 'khoca==1.5'
      - name: Compute calibrated ordinary Rasmussen invariants
        env:
          OMP_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p results/cork-2r-small-khoca-20260809
          cat > /tmp/run_cork_2r_khoca.py <<'PY'
          import json,time,traceback
          from khoca import InteractiveCalculator

          controls={
            'positive_trefoil': [[1,5,2,4],[5,3,0,2],[3,1,4,0]],
            'negative_trefoil': [[1,4,2,5],[5,2,0,3],[3,0,4,1]],
            'figure_eight': [[3,7,4,6],[1,4,2,5],[7,3,0,2],[5,0,6,1]],
          }
          expected={'positive_trefoil':2,'negative_trefoil':-2,'figure_eight':0}
          candidates=json.load(open('research/cork_2r_small_candidates_20260809.json'))
          output={'schema':'cork-2r-small-khoca-v1','controls':{},'candidates':{},'expected_controls':expected}
          path='results/cork-2r-small-khoca-20260809/result.json'

          def extract_s(result):
              active=[]
              for t,q,torsion,coefficient in result[1]:
                  c=int(coefficient)
                  if c:
                      active.extend([int(q)]*abs(c))
              active.sort()
              if len(active)!=2 or active[1]-active[0]!=2:
                  return {'ok':False,'active_q':active,'reason':'unexpected Lee E_infinity shape'}
              return {'ok':True,'active_q':active,'s':(active[0]+active[1])//2}

          def compute(pd):
              start=time.time()
              calc=InteractiveCalculator(1,(0,-1),0)
              result,messages=calc(pd,print_messages=True,progress=True)
              return {'elapsed_seconds':time.time()-start,'result':result,'messages':messages,'extracted':extract_s(result)}

          for name,pd in controls.items():
              try:
                  output['controls'][name]=compute(pd)
              except BaseException as exc:
                  output['controls'][name]={'error':repr(exc),'traceback':traceback.format_exc()}
              json.dump(output,open(path,'w'),indent=2,sort_keys=True)
              print('CONTROL',name,json.dumps(output['controls'][name].get('extracted'),sort_keys=True),flush=True)

          observed={k:v.get('extracted',{}).get('s') for k,v in output['controls'].items()}
          output['calibration_pass']=observed==expected
          json.dump(output,open(path,'w'),indent=2,sort_keys=True)
          if not output['calibration_pass']:
              raise RuntimeError(f'control calibration failed: {observed}')

          order=sorted(candidates,key=lambda k:(candidates[k]['crossings'],k))
          for name in order:
              rec=candidates[name]
              item={'crossings':rec['crossings'],'dt':rec['dt'],'hfk_summary':rec['hfk_summary'],'m':rec['m'],'eps':rec['eps'],'keep':rec['keep'],'slope':rec['slope']}
              try:
                  item['Q']=compute(rec['pd'])
                  s=item['Q'].get('extracted',{}).get('s')
                  item['terminal_nonzero_s']=s not in (None,0)
              except BaseException as exc:
                  item['Q']={'error':repr(exc),'traceback':traceback.format_exc()}
                  item['terminal_nonzero_s']=False
              output['candidates'][name]=item
              output['terminal_hits']=[k for k,v in output['candidates'].items() if v.get('terminal_nonzero_s')]
              json.dump(output,open(path,'w'),indent=2,sort_keys=True)
              print('CANDIDATE',name,json.dumps(item.get('Q',{}).get('extracted'),sort_keys=True),flush=True)
          PY
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 340m python /tmp/run_cork_2r_khoca.py 2>&1 | tee results/cork-2r-small-khoca-20260809/run.log
      - name: Commit result
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add results/cork-2r-small-khoca-20260809
          git commit -m 'Store cork 2R small cocore Khoca audit 20260809' || exit 0
          git push
