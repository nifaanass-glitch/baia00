name: Receiver trackable terminal computations 20260808

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hfk-valid:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir 'knot_floer_homology==1.2.2'
          python -m knot_floer_homology.test
      - name: Compute HFK for valid redesigned dual
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p out/hfk-valid
          cat > /tmp/hfk.py <<'PY'
          import json,time,traceback,platform,sys
          import knot_floer_homology as hfk
          rec=json.load(open('research/receiver_candidates_20260808.json'))['valid_trefoil_seed1']
          pd=rec['pd']; out={'candidate':'valid_trefoil_seed1','crossings':len(pd),'python':sys.version,'platform':platform.platform()}; t=time.time()
          try:
              m=hfk.pd_to_morse(pd); out['morse_summary']={k:v for k,v in m.items() if k!='events'}; out['morse_summary']['event_count']=len(m.get('events',[])); print('MORSE',json.dumps(out['morse_summary'],sort_keys=True),flush=True)
              ans=hfk.pd_to_hfk(pd,prime=2,complex=False); out['hfk']=ans; out['summary']={k:ans.get(k) for k in ['tau','nu','epsilon','seifert_genus','fibered','L_space_knot','total_rank','modulus']}; out['terminal_nonslice']=bool(out['summary'].get('tau') or out['summary'].get('nu') or out['summary'].get('epsilon')); print('SUMMARY',json.dumps(out['summary'],sort_keys=True),flush=True)
          except BaseException as e:
              out['error']={'type':type(e).__name__,'repr':repr(e),'traceback':traceback.format_exc()}; print('ERROR',repr(e),flush=True)
          out['elapsed_seconds']=time.time()-t
          json.dump(out,open('out/hfk-valid/result.json','w'),indent=2,sort_keys=True)
          PY
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 340m python /tmp/hfk.py 2>&1 | tee out/hfk-valid/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hfk-valid-redesign
          path: out/hfk-valid
          retention-days: 7

  hfk-alt79:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir 'knot_floer_homology==1.2.2'
          python -m knot_floer_homology.test
      - name: Compute HFK for original-boundary alternative dual
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p out/hfk-alt79
          cat > /tmp/hfk.py <<'PY'
          import json,time,traceback,platform,sys
          import knot_floer_homology as hfk
          rec=json.load(open('research/receiver_candidates_20260808.json'))['original_receiver_alt_dual79']
          pd=rec['pd']; out={'candidate':'original_receiver_alt_dual79','crossings':len(pd),'python':sys.version,'platform':platform.platform()}; t=time.time()
          try:
              m=hfk.pd_to_morse(pd); out['morse_summary']={k:v for k,v in m.items() if k!='events'}; out['morse_summary']['event_count']=len(m.get('events',[])); print('MORSE',json.dumps(out['morse_summary'],sort_keys=True),flush=True)
              ans=hfk.pd_to_hfk(pd,prime=2,complex=False); out['hfk']=ans; out['summary']={k:ans.get(k) for k in ['tau','nu','epsilon','seifert_genus','fibered','L_space_knot','total_rank','modulus']}; out['terminal_nonslice']=bool(out['summary'].get('tau') or out['summary'].get('nu') or out['summary'].get('epsilon')); print('SUMMARY',json.dumps(out['summary'],sort_keys=True),flush=True)
          except BaseException as e:
              out['error']={'type':type(e).__name__,'repr':repr(e),'traceback':traceback.format_exc()}; print('ERROR',repr(e),flush=True)
          out['elapsed_seconds']=time.time()-t
          json.dump(out,open('out/hfk-alt79/result.json','w'),indent=2,sort_keys=True)
          PY
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 340m python /tmp/hfk.py 2>&1 | tee out/hfk-alt79/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hfk-original-alt79
          path: out/hfk-alt79
          retention-days: 7

  khoca-valid:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir 'py==1.11.0' 'khoca==1.5'
      - name: Compute rational and F3 Rasmussen invariants
        env:
          OMP_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p out/khoca-valid
          cat > /tmp/khoca.py <<'PY'
          import json,time,traceback
          from khoca import InteractiveCalculator
          pd=json.load(open('research/receiver_candidates_20260808.json'))['valid_trefoil_seed1']['pd']
          def extract_s(result):
              active=[]
              for t,q,torsion,coefficient in result[1]:
                  c=int(coefficient)
                  if c: active.extend([int(q)]*abs(c))
              active.sort()
              if len(active)!=2 or active[1]-active[0]!=2: return {'ok':False,'active_q':active,'reason':'unexpected Lee E_infinity shape'}
              return {'ok':True,'active_q':active,'s':(active[0]+active[1])//2}
          out={'candidate':'valid_trefoil_seed1','crossings':len(pd),'calculations':{}}
          for name,calc in [('Q',InteractiveCalculator(1,(0,-1),0)),('F3',InteractiveCalculator(3,(0,-1),0))]:
              t=time.time()
              try:
                  result,messages=calc(pd,print_messages=True,progress=True); out['calculations'][name]={'elapsed_seconds':time.time()-t,'result':result,'messages':messages,'extracted':extract_s(result)}; print(name,json.dumps(out['calculations'][name]['extracted'],sort_keys=True),flush=True)
              except BaseException as e:
                  out['calculations'][name]={'elapsed_seconds':time.time()-t,'error':repr(e),'traceback':traceback.format_exc()}; print(name,'ERROR',repr(e),flush=True)
              json.dump(out,open('out/khoca-valid/result.json','w'),indent=2,sort_keys=True)
          vals=[v.get('extracted',{}).get('s') for v in out['calculations'].values()]; out['terminal_nonslice']=any(v not in (None,0) for v in vals); json.dump(out,open('out/khoca-valid/result.json','w'),indent=2,sort_keys=True)
          PY
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 340m python /tmp/khoca.py 2>&1 | tee out/khoca-valid/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: khoca-valid-redesign
          path: out/khoca-valid
          retention-days: 7

  ribbon-valid:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir 'snappy==3.3.2'
      - name: Proof-producing ribbon-first gate
        env:
          PYTHONHASHSEED: '2'
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p out/ribbon-valid
          cat > /tmp/ribbon.py <<'PY'
          import json,time,traceback
          import snappy
          from spherogram import Link
          from spherogram.links.bands.search import ribbon_concordant_links, verify_ribbon_to_unknot
          pd=json.load(open('research/receiver_candidates_20260808.json'))['valid_trefoil_seed1']['pd']; out={'candidate':'valid_trefoil_seed1','input_crossings':len(pd)}; start=time.time(); L=Link(pd); best=L.copy(); hist=[]
          for i in range(25):
              A=L.copy()
              try:
                  A.backtrack(30); A.simplify('basic'); A.simplify('pickup'); A.simplify('global')
                  if len(A.crossings)<len(best.crossings): best=A.copy()
                  hist.append({'round':i,'crossings':len(A.crossings),'best':len(best.crossings)})
              except BaseException as e: hist.append({'round':i,'error':repr(e)})
          out['simplification_history']=hist; out['best_crossings']=len(best.crossings); out['best_pd']=[list(x) for x in best.PD_code()]; print('BEST',len(best.crossings),flush=True)
          try:
              E=best.exterior(); F=snappy.RibbonLinks.identify(E,extends_to_link=True); out['ribbon_cache_match']=F.name() if F else None; print('CACHE',out['ribbon_cache_match'],flush=True)
          except BaseException as e: out['ribbon_cache_error']=repr(e); print('CACHE_ERROR',repr(e),flush=True)
          for label,kwargs in [('one_band_l6',dict(max_bands=1,max_twists=2,max_band_len=6,paths='shortest')),('two_band_l4',dict(max_bands=2,max_twists=2,max_band_len=4,paths='shortest'))]:
              t=time.time()
              try:
                  ans=ribbon_concordant_links(best,stop_at_unlink=True,certify=True,print_progress=True,use_ribbon_link_cache=True,filter_for_plausibly_slice=False,**kwargs); cert=ans.get('unknot') if isinstance(ans,dict) else None; rec={'elapsed_seconds':time.time()-t,'found':bool(cert),'certificate':cert};
                  if cert: rec['verified']=bool(verify_ribbon_to_unknot(best,cert))
                  out[label]=rec; print(label,json.dumps({'found':rec['found'],'verified':rec.get('verified')},sort_keys=True),flush=True)
                  if cert: break
              except BaseException as e:
                  out[label]={'elapsed_seconds':time.time()-t,'error':repr(e),'traceback':traceback.format_exc()}; print(label,'ERROR',repr(e),flush=True)
              json.dump(out,open('out/ribbon-valid/result.json','w'),indent=2,sort_keys=True)
          out['elapsed_seconds']=time.time()-start; json.dump(out,open('out/ribbon-valid/result.json','w'),indent=2,sort_keys=True)
          PY
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 340m python /tmp/ribbon.py 2>&1 | tee out/ribbon-valid/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ribbon-valid-redesign
          path: out/ribbon-valid
          retention-days: 7
