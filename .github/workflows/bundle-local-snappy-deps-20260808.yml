name: Bundle local SnapPy dependencies 20260808

on:
  push:
    paths:
      - '.github/workflows/bundle-local-snappy-deps-20260808.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download binary wheels
        run: |
          mkdir wheelhouse
          python -m pip download --only-binary=:all: --no-deps -d wheelhouse \
            'snappy_manifolds==1.4' \
            'cypari==2.5.6' \
            'low_index==1.3' \
            'plink==2.4.9' \
            'FXrays==1.3.6' \
            'tkinter-gl==1.1' \
            'pypng==0.20220715.0' \
            'pickleshare==0.7.5' \
            'knot_floer_homology==1.2.2'
          ls -lh wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: local-snappy-dependency-wheels
          path: wheelhouse
          retention-days: 7
      - name: Commit run identifier
        if: always()
        run: |
          mkdir -p results/local-snappy-dependency-bundle
          printf '%s\n' "$GITHUB_RUN_ID" > results/local-snappy-dependency-bundle/run-id.txt
          printf '%s\n' "$GITHUB_SHA" > results/local-snappy-dependency-bundle/input-commit.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/local-snappy-dependency-bundle
          git commit -m 'Store local SnapPy dependency bundle metadata' || exit 0
          git push
