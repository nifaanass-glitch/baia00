name: Bundle receiver computation dependencies 20260809

on:
  push:
    paths:
      - '.github/workflows/bundle-receiver-deps-20260809.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact binary wheels
        run: |
          python -m pip install --upgrade pip
          mkdir -p wheelhouse
          python -m pip download --only-binary=:all: --no-deps -d wheelhouse \
            'snappy_manifolds==1.4' \
            'cypari==2.5.6' \
            'low_index==1.3' \
            'plink==2.4.9' \
            'FXrays==1.3.6' \
            'tkinter-gl==1.1' \
            'pypng==0.20220715.0' \
            'pickleshare==0.7.5' \
            'knot_floer_homology==1.2.2'
          ls -lh wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: receiver-computation-wheels
          path: wheelhouse
          retention-days: 7
      - name: Commit artifact locator
        if: always()
        run: |
          mkdir -p results/receiver-computation-wheel-bundle-20260809
          printf '%s\n' "$GITHUB_RUN_ID" > results/receiver-computation-wheel-bundle-20260809/run-id.txt
          printf '%s\n' "$GITHUB_SHA" > results/receiver-computation-wheel-bundle-20260809/input-sha.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add results/receiver-computation-wheel-bundle-20260809
          git commit -m 'Store receiver dependency artifact locator 20260809' || exit 0
          git push
