name: Balanced RBG word-family sweep v2 20260809

on:
  push:
    paths:
      - '.github/workflows/balanced-rbg-word-sweep-v2-20260809.yml'
      - 'research/balanced_rbg_word_sweep_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {m: 1, b: 1}
          - {m: 1, b: -1}
          - {m: -1, b: 1}
          - {m: -1, b: -1}
          - {m: 2, b: 1}
          - {m: 2, b: -1}
          - {m: -2, b: 1}
          - {m: -2, b: -1}
          - {m: 3, b: 1}
          - {m: 3, b: -1}
          - {m: -3, b: 1}
          - {m: -3, b: -1}
          - {m: 4, b: 1}
          - {m: 4, b: -1}
          - {m: -4, b: 1}
          - {m: -4, b: -1}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir 'snappy==3.3.2' 'knot_floer_homology==1.2.2'
          python -m knot_floer_homology.test
      - name: Screen one corrected balanced RBG word
        env:
          COMMUTATOR_EXPONENT: ${{ matrix.m }}
          B_SIGN: ${{ matrix.b }}
          OUTPUT_DIR: out/rbg-v2-m${{ matrix.m }}-b${{ matrix.b }}
          PYTHONUNBUFFERED: '1'
          PYTHONHASHSEED: '2'
        run: |
          mkdir -p "$OUTPUT_DIR"
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 340m \
            python research/balanced_rbg_word_sweep_v2.py \
            2>&1 | tee "$OUTPUT_DIR/run.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rbg-v2-m${{ matrix.m }}-b${{ matrix.b }}
          path: out/rbg-v2-m${{ matrix.m }}-b${{ matrix.b }}
          retention-days: 7

  summarize:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rbg-v2-*
          path: /tmp/rbg-v2-artifacts
      - name: Aggregate corrected terminal results
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p results/balanced-rbg-word-sweep-v2-20260809
          python - <<'PY'
          import glob,json,os
          records=[]
          for path in sorted(glob.glob('/tmp/rbg-v2-artifacts/**/result.json',recursive=True)):
              try:
                  rec=json.load(open(path)); rec['_artifact_path']=path; records.append(rec)
              except Exception as exc:
                  records.append({'_artifact_path':path,'parse_error':repr(exc)})
          hits=[{'label':r.get('label'),'marked_dual':c} for r in records for c in r.get('terminal_hits',[])]
          out={
              'source_run_id':os.environ['SOURCE_RUN_ID'],
              'source_head_sha':os.environ['SOURCE_HEAD_SHA'],
              'records':records,
              'terminal_hits':hits,
              'summary':{
                  'records':len(records),
                  'completed_without_top_level_fatal_error':sum('fatal_error' not in r for r in records),
                  'marked_records':sum(len(r.get('marked_duals',[])) for r in records),
                  'terminal_hits':len(hits),
              },
          }
          json.dump(out,open('results/balanced-rbg-word-sweep-v2-20260809/summary.json','w'),indent=2,sort_keys=True)
          print(json.dumps(out['summary'],sort_keys=True))
          if hits:
              print('TERMINAL_HITS',json.dumps(hits,sort_keys=True))
          PY
      - name: Commit corrected summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add results/balanced-rbg-word-sweep-v2-20260809
          git commit -m 'Store corrected balanced RBG word sweep summary 20260809' || exit 0
          git push
