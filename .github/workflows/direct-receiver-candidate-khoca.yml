name: Direct receiver candidate Khoca certificate

on:
  push:
    paths:
      - '.github/workflows/direct-receiver-candidate-khoca.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Khoca runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir 'py==1.11.0' 'khoca==1.5'
      - name: Compute rational and F3 Rasmussen invariants
        id: compute
        continue-on-error: true
        env:
          OMP_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          cat > /tmp/compute.py <<'PY'
          import json, platform, sys, time
          from khoca import InteractiveCalculator

          candidate_pd = [[49,30,50,31],[31,48,32,49],[2,47,3,48],[63,43,64,42],[37,53,38,52],[60,34,61,33],[62,27,63,28],[56,21,57,22],[20,55,21,56],[0,17,1,18],[14,62,15,61],[7,59,8,58],[59,5,60,4],[16,3,17,4],[40,30,41,29],[35,67,36,66],[36,11,37,12],[15,32,16,33],[18,10,19,9],[19,68,20,69],[6,24,7,23],[13,27,14,26],[65,13,66,12],[8,0,9,69],[45,51,46,50],[46,1,47,2],[44,39,45,40],[43,65,44,64],[22,57,23,58],[28,42,29,41],[24,6,25,5],[25,35,26,34],[51,39,52,38],[54,67,55,68],[53,11,54,10]]
          tests = {
              'positive_trefoil': 'braidaaa',
              'negative_trefoil': 'braidAAA',
              'figure_eight': 'braidaBaB',
              'direct_receiver_candidate': candidate_pd,
          }

          def extract_s(result):
              active=[]
              for t,q,torsion,coefficient in result[1]:
                  c=int(coefficient)
                  if c:
                      active.extend([int(q)]*abs(c))
              active.sort()
              if len(active)!=2 or active[1]-active[0]!=2:
                  return {'ok':False,'active_q':active,'reason':'unexpected Lee E_infinity shape'}
              return {'ok':True,'active_q':active,'s':(active[0]+active[1])//2}

          output={'python':sys.version,'platform':platform.platform(),'candidate_PD':candidate_pd,'crossings':len(candidate_pd),'calculations':{}}
          calculators={
              'Q_X2_minus_X': InteractiveCalculator(1,(0,-1),0),
              'F3_X2_minus_X': InteractiveCalculator(3,(0,-1),0),
          }
          failures=[]
          for calc_name,calc in calculators.items():
              output['calculations'][calc_name]={}
              for name,knot in tests.items():
                  start=time.time()
                  try:
                      result,messages=calc(knot,print_messages=True,progress=True)
                      rec={'elapsed_seconds':time.time()-start,'result':result,'messages':messages,'extracted':extract_s(result)}
                  except BaseException as exc:
                      rec={'elapsed_seconds':time.time()-start,'error_type':type(exc).__name__,'error':repr(exc)}
                  output['calculations'][calc_name][name]=rec
                  print('CERTIFICATE_RECORD',calc_name,name,json.dumps(rec,sort_keys=True),flush=True)
                  with open('direct-receiver-khoca-results.json','w') as f: json.dump(output,f,indent=2,sort_keys=True)
              ext={k:output['calculations'][calc_name][k].get('extracted',{}) for k in tests}
              if ext['positive_trefoil'].get('s')!=2 or ext['negative_trefoil'].get('s')!=-2 or ext['figure_eight'].get('s')!=0:
                  failures.append(f'{calc_name}: calibration failure {ext}')
              if not ext['direct_receiver_candidate'].get('ok'):
                  failures.append(f'{calc_name}: candidate extraction failure {ext["direct_receiver_candidate"]}')
          output['failures']=failures
          output['final']={c:output['calculations'][c]['direct_receiver_candidate'].get('extracted',{}) for c in calculators}
          with open('direct-receiver-khoca-results.json','w') as f: json.dump(output,f,indent=2,sort_keys=True)
          print('FINAL',json.dumps(output['final'],sort_keys=True),flush=True)
          if failures:
              print('FAIL_CLOSED',json.dumps(failures),flush=True)
              raise SystemExit(2)
          PY
          set -o pipefail
          python /tmp/compute.py 2>&1 | tee direct-receiver-khoca-run.log
      - name: Commit certificate
        if: always()
        env:
          COMPUTE_OUTCOME: ${{ steps.compute.outcome }}
        run: |
          mkdir -p results/direct-receiver
          cp direct-receiver-khoca-results.json results/direct-receiver/ 2>/dev/null || true
          cp direct-receiver-khoca-run.log results/direct-receiver/ 2>/dev/null || true
          printf '%s\n' "$COMPUTE_OUTCOME" > results/direct-receiver/compute-outcome.txt
          printf '%s\n' "$GITHUB_RUN_ID" > results/direct-receiver/run-id.txt
          printf '%s\n' "$GITHUB_SHA" > results/direct-receiver/input-commit.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/direct-receiver
          if ! git diff --cached --quiet; then
            git commit -m 'Store direct receiver candidate Khoca certificate'
            git push
          fi
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-receiver-khoca-certificate
          path: results/direct-receiver/
          if-no-files-found: warn
          retention-days: 1
