name: Balanced receiver reconstruction calibration 20260808

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir 'snappy==3.3.2' 'knot_floer_homology==1.2.2'
      - name: Reconstruct seed 73, dual index 2, and recover its marked knot
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p out/rpb-calibration
          cat > /tmp/calibrate_receiver.py <<'PY'
          import json, math, traceback, time
          import snappy
          from spherogram import Link
          from snappy.exterior_to_link import exterior_to_link
          from snappy.exterior_to_link.main import filled_is_3sphere
          import knot_floer_homology as hfk

          catalog=json.load(open('research/rpb_unique_receiver_candidates_20260808.json'))
          rec=next(x for x in catalog if x['seed']==73)
          target_index=2
          out={'seed':73,'target_index':target_index,'expected_signatures':rec['expected_signatures']}
          try:
              L=Link(rec['link_pd']); Y=L.exterior(); out['handle_link_crossings']=len(L.crossings); out['handle_link_components']=len(L.link_components); out['dotted_sublink_matrix']=L.linking_matrix()
              Y.dehn_fill([(0,1)]*Y.num_cusps()); out['boundary_homology']=str(Y.homology()); out['boundary_tets']=Y.num_tetrahedra(); print('BOUNDARY',out['boundary_homology'],out['boundary_tets'],flush=True)
              curves=Y.dual_curves(max_segments=6); out['dual_catalog']=[{'position':i,'index':int(getattr(c,'index',i)),'repr':repr(c)} for i,c in enumerate(curves)]; print('DUALS',[(x['position'],x['index']) for x in out['dual_catalog']],flush=True)
              choices=[(i,c) for i,c in enumerate(curves) if int(getattr(c,'index',i))==target_index]
              if len(choices)!=1: raise RuntimeError(f'expected unique intrinsic index {target_index}, got {len(choices)}')
              pos,c=choices[0]; out['selected_position']=pos
              D=Y.drill(c); out['drilled_cusps_before_permanent_fill']=D.num_cusps(); out['drilled_cusp_info_before']=[str(x) for x in D.cusp_info()]
              E=D.filled_triangulation(); E=snappy.Manifold(E); out['exterior_tets']=E.num_tetrahedra(); out['exterior_homology']=str(E.homology()); print('EXTERIOR',E.num_cusps(),out['exterior_tets'],out['exterior_homology'],flush=True)
              for key,fn in [('triangulation_isosig',lambda:E.triangulation_isosig(decorated=True)),('isometry_signature',lambda:E.isometry_signature(of_link=True))]:
                  try: out[key]=str(fn()); print(key,out[key],flush=True)
                  except BaseException as exc: out[key+'_error']=repr(exc); print(key,'ERROR',repr(exc),flush=True)
              slopes=[]
              try: slopes.extend(E.short_slopes(length=7.0)[0])
              except BaseException as exc: out['short_slopes_error']=repr(exc)
              for p in range(-8,9):
                  for q in range(-8,9):
                      if math.gcd(p,q)==1 and (p,q) not in slopes: slopes.append((p,q))
              s3=[]
              for slope in slopes:
                  F=E.copy(); F.dehn_fill(slope)
                  try:
                      if str(F.homology())!='0': continue
                  except BaseException: continue
                  ok=False
                  try: ok=bool(filled_is_3sphere(F))
                  except BaseException: pass
                  if ok: s3.append(tuple(map(int,slope))); print('S3_SLOPE',slope,flush=True)
              out['s3_slopes']=s3
              if not s3: raise RuntimeError('no certified S3 slope found')
              slope=s3[0]; F=E.copy(); F.dehn_fill(slope)
              diagrams=[]
              for seed in range(6):
                  t=time.time()
                  try:
                      K=exterior_to_link(F,verbose=True,check_input=True,check_answer=True,careful_perturbation=True,simplify_link=True,pachner_search_tries=30,seed=seed)
                      pd=[list(x) for x in K.PD_code()]; m=hfk.pd_to_morse(pd); item={'seed':seed,'crossings':len(K.crossings),'pd':pd,'dt':str(K.DT_code()),'morse_girth':m.get('girth'),'morse_events':len(m.get('events',[])),'elapsed_seconds':time.time()-t}; diagrams.append(item); print('DIAGRAM',seed,item['crossings'],item['morse_girth'],flush=True)
                  except BaseException as exc: diagrams.append({'seed':seed,'error':repr(exc),'traceback':traceback.format_exc(),'elapsed_seconds':time.time()-t}); print('DIAGRAM_ERROR',seed,repr(exc),flush=True)
              out['diagrams']=diagrams
          except BaseException as exc:
              out['fatal_error']=repr(exc); out['traceback']=traceback.format_exc(); print('FATAL',repr(exc),flush=True)
          json.dump(out,open('out/rpb-calibration/result.json','w'),indent=2,sort_keys=True)
          PY
          set -o pipefail
          python /tmp/calibrate_receiver.py 2>&1 | tee out/rpb-calibration/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpb-reconstruction-calibration
          path: out/rpb-calibration
          retention-days: 7
