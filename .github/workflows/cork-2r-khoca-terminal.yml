name: Cork-amplified 2R Khoca terminal gate

on:
  pull_request:
    paths:
      - 'research/cork_2r_khoca_terminal.py'
      - '.github/workflows/cork-2r-khoca-terminal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rasmussen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Khoca
        run: python -m pip install --upgrade pip khoca==1.5
      - name: Compute calibrated rational and F3 Rasmussen invariants
        shell: bash
        run: |
          set -o pipefail
          python research/cork_2r_khoca_terminal.py 2>&1 | tee cork-2r-khoca-run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cork-2r-khoca-terminal
          path: |
            cork-2r-khoca-result.json
            cork-2r-khoca-run.log
          if-no-files-found: warn
