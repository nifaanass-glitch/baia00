name: Receiver Khoca fixed terminal computation 20260808

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  khoca-valid-fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir 'py==1.11.0' 'khoca==1.5'
      - name: Compute rational and F3 Rasmussen invariants
        env:
          OMP_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p out/khoca-valid-fixed
          cat > /tmp/compute_receiver_rasmussen.py <<'PY'
          import json,time,traceback
          from khoca import InteractiveCalculator
          pd=json.load(open('research/receiver_candidates_20260808.json'))['valid_trefoil_seed1']['pd']
          def extract_s(result):
              active=[]
              for t,q,torsion,coefficient in result[1]:
                  c=int(coefficient)
                  if c: active.extend([int(q)]*abs(c))
              active.sort()
              if len(active)!=2 or active[1]-active[0]!=2: return {'ok':False,'active_q':active,'reason':'unexpected Lee E_infinity shape'}
              return {'ok':True,'active_q':active,'s':(active[0]+active[1])//2}
          out={'candidate':'valid_trefoil_seed1','crossings':len(pd),'calculations':{}}
          for name,calc in [('Q',InteractiveCalculator(1,(0,-1),0)),('F3',InteractiveCalculator(3,(0,-1),0))]:
              t=time.time()
              try:
                  result,messages=calc(pd,print_messages=True,progress=True); out['calculations'][name]={'elapsed_seconds':time.time()-t,'result':result,'messages':messages,'extracted':extract_s(result)}; print(name,json.dumps(out['calculations'][name]['extracted'],sort_keys=True),flush=True)
              except BaseException as e:
                  out['calculations'][name]={'elapsed_seconds':time.time()-t,'error':repr(e),'traceback':traceback.format_exc()}; print(name,'ERROR',repr(e),flush=True)
              json.dump(out,open('out/khoca-valid-fixed/result.json','w'),indent=2,sort_keys=True)
          vals=[v.get('extracted',{}).get('s') for v in out['calculations'].values()]; out['terminal_nonslice']=any(v not in (None,0) for v in vals); json.dump(out,open('out/khoca-valid-fixed/result.json','w'),indent=2,sort_keys=True)
          PY
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 340m python /tmp/compute_receiver_rasmussen.py 2>&1 | tee out/khoca-valid-fixed/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: khoca-valid-redesign-fixed
          path: out/khoca-valid-fixed
          retention-days: 7
