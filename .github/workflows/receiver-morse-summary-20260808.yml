name: Receiver Morse summary 20260808

on:
  push:
    paths:
      - '.github/workflows/receiver-morse-summary-20260808.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir 'knot_floer_homology==1.2.2'
      - run: |
          mkdir -p results/receiver-morse-summary-20260808
          python - <<'PY'
          import json,time
          import knot_floer_homology as hfk
          data=json.load(open('research/receiver_candidates_20260808.json'))
          out={}
          for name,rec in data.items():
              t=time.time(); m=hfk.pd_to_morse(rec['pd'])
              summary={k:v for k,v in m.items() if k!='events'}
              summary['event_count']=len(m.get('events',[]))
              summary['cross_event_count']=sum(1 for e in m.get('events',[]) if e[0]=='cross')
              summary['cup_count']=sum(1 for e in m.get('events',[]) if e[0]=='cup')
              summary['cap_count']=sum(1 for e in m.get('events',[]) if e[0]=='cap')
              summary['elapsed_seconds']=time.time()-t
              out[name]=summary
              print(name,json.dumps(summary,sort_keys=True),flush=True)
          with open('results/receiver-morse-summary-20260808/summary.json','w') as f: json.dump(out,f,indent=2,sort_keys=True)
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/receiver-morse-summary-20260808
          git commit -m 'Store receiver Morse summary 20260808' || exit 0
          git push
