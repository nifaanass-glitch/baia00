name: Isolated cork 2R Rasmussen matrix

# isolated trigger 2026-08-09T04:12Z
on:
  push:
    branches: [cork-2r-khoca-isolated]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rasmussen:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        candidate:
          - K14n3411_exact_cocore
          - m_n2_b_p1_mT2_3_keep1_exact_cocore
          - m_n2_b_p1_figure8_keep1_exact_cocore
          - m_n2_b_p1_T2_3_keep1_exact_cocore
          - m_n2_b_n1_T2_3_keep1_exact_cocore
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install calibrated Lee engine
        run: python -m pip install --upgrade pip 'py==1.11.0' 'khoca==1.5'
      - name: Compute ordinary rational Rasmussen invariant
        env:
          CANDIDATE: ${{ matrix.candidate }}
          OMP_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python run_khoca.py 2>&1 | tee run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: khoca-${{ matrix.candidate }}
          path: |
            result.json
            run.log
          if-no-files-found: warn
          retention-days: 7
