name: Audit published RBG table for balanced toxic receivers 20260808

on:
  push:
    paths:
      - '.github/workflows/audit-rbg-unlink-receivers-20260808.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir 'snappy==3.3.2' 'pandas==2.3.1'
      - name: Download fixed-source table and audit every RBG link
        run: |
          mkdir -p results/rbg-balanced-receiver-audit-20260808
          curl -L --fail --silent --show-error \
            'https://raw.githubusercontent.com/EugeneFrancisco/plausibly_slice_v1/a10c68c0c8fe8ec9f39a3a0c59a3b196eb323126/Data/unknown_with_0-friend_final.csv' \
            -o /tmp/unknown_with_0-friend_final.csv
          sha256sum /tmp/unknown_with_0-friend_final.csv | tee results/rbg-balanced-receiver-audit-20260808/source-sha256.txt
          cat > /tmp/audit.py <<'PY'
          import ast, json, math, traceback
          from pathlib import Path
          import pandas as pd
          import snappy
          from spherogram import Link

          def simplify(link, rounds=8):
              for _ in range(rounds):
                  for mode in ('basic','pickup','global'):
                      try: link.simplify(mode)
                      except BaseException: pass
              return link

          def unlink_certificate(link):
              initial=len(link.link_components)+getattr(link,'unlinked_unknot_components',0)
              work=simplify(link.copy(),10)
              rec={
                  'initial_components':initial,
                  'crossings_after_simplify':len(work.crossings),
                  'drawn_components_after':len(work.link_components),
                  'detached_counter_after':getattr(work,'unlinked_unknot_components',0),
              }
              if initial==2 and len(work.crossings)==0:
                  rec['status']='CERTIFIED_BY_REIDEMEISTER_ELIMINATION'; rec['is_unlink']=True; return rec
              try:
                  E=work.exterior(); rec['exterior_homology']=str(E.homology()); rec['exterior_solution_type']=E.solution_type()
                  G=E.fundamental_group(); G.simplify(); rec['group_generators']=G.num_generators(); rec['group_relators']=G.num_relators(); rec['group_presentation']=str(G)
                  if initial==2 and G.num_generators()==2 and G.num_relators()==0:
                      rec['status']='CERTIFIED_BY_FREE_GROUP_EXTERIOR'; rec['is_unlink']=True; return rec
              except BaseException as e: rec['exterior_error']=repr(e)
              rec['status']='NOT_CERTIFIED'; rec['is_unlink']=False; return rec

          df=pd.read_csv('/tmp/unknown_with_0-friend_final.csv')
          output={'source_commit':'a10c68c0c8fe8ec9f39a3a0c59a3b196eb323126','rows':[],'terminal_hits':[]}
          for _,row in df.iterrows():
              s3=None if pd.isna(row.get('s_3')) else int(row.get('s_3'))
              s2=None if pd.isna(row.get('s_2')) else int(row.get('s_2'))
              rec={'name':row['name'],'base_knot':row['base_knot'],'s_2':s2,'s_3':s3,'framing':str(row['framing'])}
              try:
                  pdcode=ast.literal_eval(row['RBG_PD']); L=Link(pdcode); rec['RBG_crossings']=len(L.crossings); rec['linking_matrix']=L.linking_matrix()
                  if len(L.link_components)!=3: raise RuntimeError(f'expected 3 RBG components, got {len(L.link_components)}')
                  BG=L.sublink([1,2]); rec['blue_green_unlink']=unlink_certificate(BG)
                  lm=rec['linking_matrix']; v=[int(lm[0][1]),int(lm[0][2])]; rec['receiver_attaching_vector']=v; rec['receiver_vector_primitive']=math.gcd(abs(v[0]),abs(v[1]))==1
                  framings=ast.literal_eval(row['framing']); rec['blue_green_zero_framed']=tuple(framings[1])==(0,1) and tuple(framings[2])==(0,1)
                  rec['balanced_receiver_certified']=bool(rec['blue_green_unlink']['is_unlink'] and rec['receiver_vector_primitive'] and rec['blue_green_zero_framed'])
                  rec['terminal_nonslice_friend']=bool(rec['balanced_receiver_certified'] and ((s3 is not None and s3!=0) or (s2 is not None and s2!=0)))
                  if rec['terminal_nonslice_friend']: output['terminal_hits'].append(rec)
                  print(row['name'],'s3=',s3,'BG_unlink=',rec['blue_green_unlink']['status'],'v=',v,'TERMINAL=',rec['terminal_nonslice_friend'],flush=True)
              except BaseException as e:
                  rec['error']=repr(e); rec['traceback']=traceback.format_exc(); print(row['name'],'ERROR',repr(e),flush=True)
              output['rows'].append(rec)
              json.dump(output,open('results/rbg-balanced-receiver-audit-20260808/audit.json','w'),indent=2,sort_keys=True)
          output['summary']={
              'rows':len(output['rows']),
              'balanced_receivers':sum(bool(r.get('balanced_receiver_certified')) for r in output['rows']),
              'terminal_hits':len(output['terminal_hits']),
          }
          json.dump(output,open('results/rbg-balanced-receiver-audit-20260808/audit.json','w'),indent=2,sort_keys=True)
          print('SUMMARY',json.dumps(output['summary'],sort_keys=True),flush=True)
          PY
          python /tmp/audit.py 2>&1 | tee results/rbg-balanced-receiver-audit-20260808/run.log
      - name: Commit audit packet
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/rbg-balanced-receiver-audit-20260808
          git commit -m 'Store balanced RBG receiver audit 20260808' || exit 0
          git push
